<div class="container my-5">
  <h2 class="section-title mb-4">Your Shopping Cart</h2>

  <div class="row g-4">
    <div class="col-lg-8">
      @for (item of cartList; track $index) {
        <div class="cart-item-card mb-3">
          <div class="cart-img-box">
            <img [src]="item.image" alt="Product">
          </div>

          <div class="cart-item-details">
            <div>
              <span class="text-muted small">Product ID: #{{item.id}}</span>
              <h5 class="cart-item-title mt-1">Order Details (User: {{item.userId}})</h5>
              <p class="text-muted small text-truncate" style="max-width: 300px;">{{item.description}}</p>
            </div>

            <div class="cart-item-actions">
              <span class="cart-item-price">$99.99</span>

              <button class="btn-remove" (click)="removeCart(item.id)">
                <i class="bi bi-trash"></i> Remove
              </button>

            </div>
          </div>
        </div>
      } @empty {
        <div class="text-center py-5">
          <p class="text-muted">Your cart is empty.</p>
        </div>
      }
    </div>

    <div class="col-lg-4">
      <div class="summary-card">
        <h4 class="summary-title">Order Summary</h4>
        <hr>
        <div class="d-flex justify-content-between mb-2">
          <span>Subtotal</span>
          <strong>$299.97</strong>
        </div>
        <div class="d-flex justify-content-between mb-3">
          <span>Shipping</span>
          <span class="text-success">Free</span>
        </div>
        <hr>
        <div class="d-flex justify-content-between mb-4">
          <h5>Total</h5>
          <h4 class="text-danger font-weight-bold">$299.97</h4>
        </div>
        <button class="btn-checkout w-100">Proceed to Checkout</button>
      </div>
    </div>
  </div>
</div>
