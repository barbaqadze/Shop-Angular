<div class="container my-5" style="max-width: 500px;">
  <h2 class="mb-4 text-center">Register</h2>

  <form (submit)="onRegister($event)">
    <div class="row">
      <div class="col mb-3">
        <label class="form-label">First Name</label>
        <input type="text" class="form-control" name="firstname" placeholder="John" required>
      </div>
      <div class="col mb-3">
        <label class="form-label">Last Name</label>
        <input type="text" class="form-control" name="lastname" placeholder="Doe" required>
      </div>
    </div>

    <div class="mb-3">
      <label class="form-label">Email</label>
      <input type="email" class="form-control" name="email" placeholder="john@gmail.com" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" name="username" placeholder="johndoe123" required>
    </div>

    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" placeholder="••••••••" required>
    </div>

    <button type="submit" class="btn btn-dark w-100">Sign Up</button>
  </form>

  <div class="mt-3 text-center">
    <small>უკვე გაქვს აქაუნთი? <a routerLink="/login">შედი აქედან</a></small>
  </div>
</div>
