<div class="container my-5" style="max-width: 400px;">
  <h2 class="mb-4 text-center">Login</h2>

  <form (submit)="onLogin($event)">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" class="form-control" name="username" placeholder="მაგ: mor_2314" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Password</label>
      <input type="password" class="form-control" name="password" placeholder="მაგ: 83r5ax_" required>
    </div>
    <button type="submit" class="btn btn-dark w-100">Sign In</button>
  </form>

  <div class="mt-3 text-center">
    <small>არ გაქვს აქაუნთი? <a routerLink="/register">დარეგისტრირდი</a></small>
  </div>
</div>
